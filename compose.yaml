services:
  app:
    image: tumuer/router-status:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      DATABASE_PATH: /app/data/status.sqlite
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - ./data:/app/data
    stop_grace_period: 90s
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', '--output', '/dev/null', 'http://127.0.0.1:8787/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
