<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0A0B14" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="emrank.tech 网关与模型服务的实时运行状态：可用率、延迟和各地区检测结果。" />
		<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<title>emrank.tech 服务状态</title>
		<script>
			// Apply the saved or system colour scheme before first paint (mirrors MUI's storage keys).
			(function () {
				try {
					var mode = localStorage.getItem('status-color-mode') || 'system';
					var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
				} catch (e) {
					document.documentElement.setAttribute('data-color-scheme', 'light');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
